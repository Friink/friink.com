<!DOCTYPE html>
<html class="scroll-smooth" lang="en">

<head>
	<meta charset="utf-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<meta name="theme-color" content="#faf8ff" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#101816" media="(prefers-color-scheme: dark)">
	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="shortcut icon" href="favicon.png">
	<title>Friink - Coming soon.</title>
	<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
	<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
	<style>
		:root {
			--brand: #006655;
			--primary-container: #2dd4bf;
			--background: #faf8ff;
			--surface: #faf8ff;
			--surface-container: #eaedff;
			--surface-container-low: #f2f3ff;
			--surface-container-high: #e2e7ff;
			--surface-container-highest: #dae2fd;
			--on-surface: #131b2e;
			--on-surface-variant: #3c4a46;
			--outline: #6b7a76;
			--on-primary: #ffffff;
			--outline-variant: #bec9c4;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--brand: #75d7c0;
				--primary-container: #006655;
				--background: #101816;
				--surface: #18211f;
				--surface-container: #1d2a27;
				--surface-container-low: #141d1b;
				--surface-container-high: #263530;
				--surface-container-highest: #30413b;
				--on-surface: #e7f1ed;
				--on-surface-variant: #b8c9c3;
				--outline: #8ea69d;
				--on-primary: #00201c;
				--outline-variant: #52655e;
			}

			.footer-logo {
				filter: invert(1) brightness(1.8);
			}

			.header-logo {
				filter: invert(1) brightness(1.8);
			}
		}
	</style>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						"primary": "var(--brand)",
						"on-primary": "var(--on-primary)",
						"outline": "var(--outline)",
						"outline-variant": "var(--outline-variant)",
						"background": "var(--background)",
						"surface": "var(--surface)",
						"surface-container": "var(--surface-container)",
						"surface-container-low": "var(--surface-container-low)",
						"on-surface": "var(--on-surface)",
						"on-surface-variant": "var(--on-surface-variant)"
					},
					borderRadius: {
						"DEFAULT": "0.25rem",
						"lg": "0.5rem",
						"xl": "0.75rem",
						"3xl": "1.5rem",
						"full": "9999px"
					},
					spacing: {
						"container-padding-mobile": "20px",
						"container-padding-desktop": "40px",
						"base": "8px",
						"gutter": "24px",
						"section-gap": "80px"
					},
					fontFamily: {
						"body-md": ["Nunito Sans"],
						"headline-md": ["Nunito Sans"],
						"label-md": ["Nunito Sans"]
					},
					fontSize: {
						"body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
						"headline-md": ["24px", { lineHeight: "32px", fontWeight: "700" }],
						"label-md": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "600" }]
					}
				}
			}
		};
	</script>
	<script src="assets/js/components.js" defer></script>
</head>

<body class="min-h-screen bg-background text-on-surface font-body-md antialiased flex flex-col">
	<friink-header></friink-header>
	<main class="flex flex-1 flex-col items-center justify-center px-container-padding-mobile md:px-container-padding-desktop py-24 text-center">
		<section class="max-w-xl">
			<img src="assets/brand/logo065.svg" alt="Friink" class="h-24 w-auto mx-auto mb-8">
			<h1 class="text-4xl md:text-5xl font-bold mb-4">Coming soon.</h1>
			<p class="text-lg text-on-surface-variant">Friink - A place for humans.</p>
		</section>
		<friink-waitlist></friink-waitlist>
	</main>
	<friink-footer></friink-footer>
</body>

</html>
